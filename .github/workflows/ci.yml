name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Run Pytest suite
      run: |
        pytest -v

  wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Build source distribution
      run: |
        python -m build --sdist

    - name: Install wheel in an isolated environment
      run: |
        python -m venv .wheel-venv
        .wheel-venv/bin/python -m pip install dist/*.whl

    - name: Verify installed API, data, CLI, and dependencies
      run: |
        test "$(.wheel-venv/bin/gbparse --version)" = "gbparse 0.9.3"
        .wheel-venv/bin/python -c "from importlib.resources import files; from genbank_parser import __version__; from genbank_parser.meor import load_meor_database; from genbank_parser.mobilome import load_mobilome_database; db=load_mobilome_database(); root=files('genbank_parser'); assert __version__ == '0.9.3'; assert load_meor_database().catalog_version == '1.1'; assert db.catalog_version == '1.5.0'; assert db.provenance_version == '1.5.0'; assert db.inference_version == '1.6.0'; assert root.joinpath('py.typed').is_file(); assert root.joinpath('data/meor/markers.yaml').is_file(); assert root.joinpath('data/schemas/feature-v1.schema.json').is_file(); assert root.joinpath('data/schemas/operons-v1.schema.json').is_file(); assert root.joinpath('data/schemas/query-v1.schema.json').is_file(); assert root.joinpath('data/schemas/record-v1.schema.json').is_file(); assert root.joinpath('data/schemas/index-report-v1.schema.json').is_file(); assert root.joinpath('data/schemas/index-status-v1.schema.json').is_file(); assert root.joinpath('data/schemas/batch-v1.schema.json').is_file(); assert files('genbank_parser.rulesets').joinpath('mobilome.yaml').is_file(); assert root.joinpath('data/mobilome/markers.yaml').is_file(); assert root.joinpath('data/mobilome/provenance.yaml').is_file(); assert root.joinpath('data/mobilome/inference.yaml').is_file(); assert root.joinpath('data/mobilome/report.schema.json').is_file()"
        .wheel-venv/bin/python -c "import gzip; from pathlib import Path; from genbank_parser import read_genbank; source=Path('tests/fixtures/simple_cds.gb'); gzip.open('wheel-input.gz', 'wb').write(source.read_bytes()); assert read_genbank('wheel-input.gz').all_features"
        .wheel-venv/bin/gbparse batch wheel-input.gz --command metadata --output-dir wheel-gzip-batch -- --format json
        .wheel-venv/bin/python -c "import json; from pathlib import Path; m=json.loads(Path('wheel-gzip-batch/batch-manifest.json').read_text()); assert m['jobs'][0]['status'] == 'succeeded'; assert m['jobs'][0]['input']['display_path'].endswith('wheel-input.gz')"
        .wheel-venv/bin/gbparse query tests/fixtures/simple_cds.gb --where 'type == "CDS"' --format jsonl --output wheel-query.jsonl
        if .wheel-venv/bin/gbparse query tests/fixtures/simple_cds.gb --where 'type == "CDS"' --select sample_key; then exit 1; else test "$?" -eq 2; fi
        .wheel-venv/bin/python -c "import json; rows=[json.loads(line) for line in open('wheel-query.jsonl') if line.strip()]; assert rows and all(row['schema_version'] == 'gbparse.feature.v1' for row in rows)"
        .wheel-venv/bin/gbparse records list tests/fixtures/simple_cds.gb --format json --output wheel-records.json
        .wheel-venv/bin/gbparse index build tests/fixtures/simple_cds.gb wheel-index.gbidx --report wheel-index-report.json
        .wheel-venv/bin/gbparse index query wheel-index.gbidx --where 'type == "CDS"' --format jsonl --output wheel-index-query.jsonl
        .wheel-venv/bin/gbparse index status wheel-index.gbidx --format json --output wheel-index-status.json
        .wheel-venv/bin/gbparse batch tests/fixtures/simple_cds.gb --command validate --output-dir wheel-batch -- --format json
        .wheel-venv/bin/python -c "import json; from pathlib import Path; rows=json.loads(Path('wheel-records.json').read_text()); assert rows and rows[0]['schema_version'] == 'gbparse.record.v1'; report=json.loads(Path('wheel-index-report.json').read_text()); assert report['schema_version'] == 'gbparse.index-report.v1'; status=json.loads(Path('wheel-index-status.json').read_text()); assert status['schema_version'] == 'gbparse.index-status.v1'; manifest=json.loads(Path('wheel-batch/batch-manifest.json').read_text()); assert manifest['jobs'][0]['status'] == 'succeeded'; assert manifest['runner']['working_directory']; forbidden=('.gbparse-input.','.gbparse-inprogress','.work.'); assert not any(token in path.read_text(errors='ignore') for path in Path('wheel-batch').rglob('*') if path.is_file() for token in forbidden)"
        .wheel-venv/bin/python -m pip install "jsonschema>=4.23,<5"
        .wheel-venv/bin/python -c "import json; from pathlib import Path; from importlib.resources import files; import jsonschema; root=files('genbank_parser').joinpath('data','schemas'); feature=json.loads(root.joinpath('feature-v1.schema.json').read_text()); record=json.loads(root.joinpath('record-v1.schema.json').read_text()); index_report=json.loads(root.joinpath('index-report-v1.schema.json').read_text()); batch=json.loads(root.joinpath('batch-v1.schema.json').read_text()); jsonschema.Draft202012Validator.check_schema(feature); jsonschema.Draft202012Validator.check_schema(record); jsonschema.Draft202012Validator.check_schema(index_report); jsonschema.Draft202012Validator.check_schema(batch)"
        .wheel-venv/bin/python -c "import json; from pathlib import Path; from importlib.resources import files; import jsonschema; root=files('genbank_parser').joinpath('data','schemas'); schemas={name: json.loads(root.joinpath(name).read_text()) for name in ('record-v1.schema.json','index-report-v1.schema.json','index-status-v1.schema.json','batch-v1.schema.json')}; [jsonschema.validate(row, schemas['record-v1.schema.json']) for row in json.loads(Path('wheel-records.json').read_text())]; jsonschema.validate(json.loads(Path('wheel-index-report.json').read_text()), schemas['index-report-v1.schema.json']); jsonschema.validate(json.loads(Path('wheel-index-status.json').read_text()), schemas['index-status-v1.schema.json']); jsonschema.validate(json.loads(Path('wheel-batch/batch-manifest.json').read_text()), schemas['batch-v1.schema.json'])"
        .wheel-venv/bin/gbparse export tests/fixtures/simple_cds.gb --format bed12 --output wheel-export.bed
        .wheel-venv/bin/python -c "rows=[line.rstrip('\\n').split('\\t') for line in open('wheel-export.bed') if line.strip()]; assert rows and all(len(row) == 12 and 0 <= int(row[1]) < int(row[2]) <= 100 for row in rows)"
        .wheel-venv/bin/gbparse operons tests/fixtures/simple_cds.gb --format json --output wheel-operons.json
        .wheel-venv/bin/python -c "import json; assert json.load(open('wheel-operons.json'))['schema_version'] == 'gbparse.operons.v1'"
        .wheel-venv/bin/gbparse --help
        .wheel-venv/bin/gbparse meor tests/fixtures/meor_parity.gb --format json --output wheel-meor.json
        .wheel-venv/bin/python -c "import json; p=json.load(open('wheel-meor.json')); assert p['tool_version'] == '0.9.3'; assert p['catalog_version'] == '1.1'"
        .wheel-venv/bin/gbparse mobilome --help
        .wheel-venv/bin/gbparse mobilome tests/fixtures/mobilome_evidence.gb --format json --output wheel-mobilome.json
        .wheel-venv/bin/python -c "import json; p=json.load(open('wheel-mobilome.json')); assert p['schema_version'] == 'gbparse.mobilome.v2'; assert p['tool_version'] == '0.9.3'; assert p['catalog_version'] == '1.5.0'; assert p['inference_version'] == '1.6.0'"
        .wheel-venv/bin/gbparse discover tests/fixtures/mobilome_evidence.gb --ruleset mobilome
        .wheel-venv/bin/python -m pip check

    - name: Verify source distribution in an isolated environment
      run: |
        python -m venv .sdist-venv
        .sdist-venv/bin/python -m pip install dist/*.tar.gz
        test "$(.sdist-venv/bin/gbparse --version)" = "gbparse 0.9.3"
        .sdist-venv/bin/python -c "from importlib.resources import files; from genbank_parser import __version__; assert __version__ == '0.9.3'; assert files('genbank_parser').joinpath('data/schemas/feature-v1.schema.json').is_file(); assert files('genbank_parser').joinpath('data/schemas/batch-v1.schema.json').is_file()"
        .sdist-venv/bin/python -m pip check

    - name: Verify optional visualization extra from the wheel
      env:
        MPLBACKEND: Agg
      run: |
        python -m venv .viz-venv
        wheel_path=$(find dist -name '*.whl' -print -quit)
        .viz-venv/bin/python -m pip install "${wheel_path}[viz]"
        .viz-venv/bin/gbparse neighborhood tests/fixtures/simple_cds.gb TEST_001 1 --format json --output wheel-neighborhood.json --visualize --viz-output wheel-neighborhood.svg
        test -s wheel-neighborhood.svg
        grep -q '<svg' wheel-neighborhood.svg
        .viz-venv/bin/python -m pip check

  cohort:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: python -m pip install -e ".[test]"

    - name: Run cohort regression gates
      run: python -m pytest -q tests/test_v090_cohort.py tests/test_v091_hardening.py tests/test_v092_release_blockers.py tests/test_v093_release_blockers.py

  windows-full-suite:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: python -m pip install -e ".[test]"

    - name: Run complete Windows suite
      run: python -m pytest -q
