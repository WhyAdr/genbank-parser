schema_version: 1
provenance_version: "1.3.0"

sources:
  - id: blower-2012-toxin
    type: primary_article
    title: Identification and classification of bacterial Type III toxin-antitoxin systems encoded in chromosomal and plasmid genomes
    year: 2012
    doi: 10.1093/nar/gks231
    pmid: "22434880"
    pmcid: PMC3401426
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3401426/
    supports:
      - ToxI is the RNA antitoxin in the Type III ToxIN system.
    limitations:
      - Annotation correspondence does not establish activity in a new genome.
  - id: yao-2020-hepn-mnt
    type: primary_article
    title: "Novel polyadenylylation-dependent neutralization mechanism of the HEPN/MNT toxin/antitoxin system"
    year: 2020
    doi: 10.1093/nar/gkaa855
    pmid: "33045733"
    pmcid: PMC7641770
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7641770/
    supports:
      - In the studied system MntA transfers three AMP moieties from ATP to HepT Tyr104 in the RX4HXY motif.
    limitations:
      - The biochemical result must not be generalized to every HEPN/MNT annotation.
  - id: smillie-2010-mobility
    type: primary_article
    title: Mobility of Plasmids
    year: 2010
    doi: 10.1128/MMBR.00020-10
    pmid: "20805406"
    pmcid: PMC2937521
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2937521/
    supports:
      - Mobilizable plasmids may use helper mating-pair-formation machinery.
    limitations:
      - Annotation co-occurrence does not establish transfer or co-transfer.
  - id: robertson-2018-mob-suite
    type: primary_article
    title: "MOB-suite: software tools for clustering, reconstruction and typing of plasmids from draft assemblies"
    year: 2018
    doi: 10.1099/mgen.0.000206
    pmid: "30052170"
    pmcid: PMC6159552
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6159552/
    supports:
      - MOB-suite plasmid typing and mobility results depend on versioned databases and operating thresholds.
    limitations:
      - Database composition, taxonomic coverage, and thresholds affect external plasmid-typing interpretation.
  - id: akhtar-2012-pxo1
    type: primary_article
    title: "Two independent replicons can support replication of the anthrax toxin-encoding plasmid pXO1 of Bacillus anthracis"
    year: 2012
    doi: 10.1016/j.plasmid.2011.12.012
    pmid: "22239982"
    pmcid: PMC4186245
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4186245/
    supports:
      - pXO annotations alone do not specify a single replication mechanism.
    limitations:
      - Product labels are not a sequence-homology or ancestry result.
  - id: anand-2008-repx
    type: primary_article
    title: "GTP-dependent polymerization of the tubulin-like RepX replication protein encoded by the pXO1 plasmid of Bacillus anthracis"
    year: 2008
    doi: 10.1111/j.1365-2958.2007.06100.x
    pmid: "18179418"
    url: https://doi.org/10.1111/j.1365-2958.2007.06100.x
    supports:
      - RepX is a tubulin-like replication initiator encoded on pXO1 of Bacillus anthracis.
    limitations:
      - Annotation alone does not identify the replication mechanism (rolling-circle, theta, or strand-displacement).
  - id: tinsley-2006-repx
    type: primary_article
    title: "A novel FtsZ-like protein is involved in replication of the anthrax toxin-encoding pXO1 plasmid in Bacillus anthracis"
    year: 2006
    doi: 10.1128/JB.188.8.2829-2835.2006
    pmid: "16585744"
    pmcid: PMC1447009
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1447009/
    supports:
      - An FtsZ-like protein (RepX) is required for pXO1 replication in Bacillus anthracis.
    limitations:
      - An FtsZ-like annotation does not establish a replication mechanism without further analysis.
  - id: erez-2017-arbitrium
    type: primary_article
    title: Communication between viruses guides lysis-lysogeny decisions
    year: 2017
    doi: 10.1038/nature21049
    pmid: "28099413"
    pmcid: PMC5378303
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5378303/
    supports:
      - AimR, AimP, and AimX participate in the described phage correspondence.
    limitations:
      - One annotation does not establish communication activity in a new genome.
  - id: bouet-2019-partition
    type: primary_article
    title: "Plasmid Localization and Partition in Enterobacteriaceae"
    year: 2019
    doi: 10.1128/ecosalplus.esp-0003-2019
    pmid: "31187729"
    url: https://journals.asm.org/doi/10.1128/ecosalplus.esp-0003-2019
    supports:
      - Plasmid partition (Par) systems are actively driven maintenance systems with ParA/ParB-type and tubulin-type components.
    limitations:
      - The review emphasizes Enterobacteriaceae; partition component naming elsewhere varies.
  - id: carattoli-2014-plasmidfinder
    type: primary_article
    title: "In silico detection and typing of plasmids using PlasmidFinder and plasmid multilocus sequence typing"
    year: 2014
    doi: 10.1128/AAC.02412-14
    pmid: "24777092"
    url: https://journals.asm.org/doi/10.1128/aac.02412-14
    supports:
      - Replicon-based plasmid typing depends on a curated database with declared thresholds.
    limitations:
      - Replicon typing coverage is database- and lineage-dependent.
  - id: chen-2005-vfdb
    type: primary_article
    title: "VFDB: a reference database for bacterial virulence factors"
    year: 2005
    doi: 10.1093/nar/gki008
    pmid: "15608208"
    url: https://academic.oup.com/nar/article/33/suppl_1/D325/2505203
    supports:
      - Virulence-factor determination is a curated-database comparison, not a product-text result.
    limitations:
      - Database releases supersede this original description; version provenance is required.
  - id: christie-2025-t4ss
    type: primary_article
    title: "Type IV secretion systems: reconciling diversity through a unified nomenclature"
    year: 2025
    doi: 10.1093/femsre/fuaf069
    pmid: "41474020"
    url: https://academic.oup.com/femsre/article/doi/10.1093/femsre/fuaf069/8407627
    supports:
      - Mating-pair-formation (MPF) and Dtr component names follow a proposed unified nomenclature for type IV secretion systems.
    limitations:
      - A unified component name does not indicate a complete or active secretion system.
  - id: feldgarden-2021-amrfinderplus
    type: primary_article
    title: "AMRFinderPlus and the Reference Gene Catalog facilitate examination of the genomic links among antimicrobial resistance, stress response, and virulence"
    year: 2021
    doi: 10.1038/s41598-021-91456-0
    pmid: "34135355"
    url: https://www.nature.com/articles/s41598-021-91456-0
    supports:
      - Structured antimicrobial-resistance annotation requires a curated reference gene catalog with method and threshold provenance.
    limitations:
      - A reference-catalog hit is not a resistance phenotype measurement.
  - id: garcillan-barcia-2009-relaxases
    type: primary_article
    title: "The diversity of conjugative relaxases and its application in plasmid classification"
    year: 2009
    doi: 10.1111/j.1574-6976.2009.00168.x
    pmid: "19396961"
    url: https://academic.oup.com/femsre/article/33/3/657/591359
    supports:
      - Relaxase (MOB) gene families underpin plasmid mobility classification; names such as mobA, mobC, and mobF denote relaxases.
    limitations:
      - A relaxase gene-name match alone is not a family assignment or phylogenetic result.
  - id: makarova-2020-crispr
    type: primary_article
    title: "Evolutionary classification of CRISPR-Cas systems: a burst of class 2 and derived variants"
    year: 2020
    doi: 10.1038/s41579-019-0299-x
    pmid: "31857715"
    url: https://www.nature.com/articles/s41579-019-0299-x
    supports:
      - Cas genes follow an evolutionary classification into classes, types, and subtypes.
    limitations:
      - A cas gene-name match does not establish a complete or active CRISPR-Cas locus.
  - id: siguier-2006-isfinder
    type: primary_article
    title: "ISfinder: the reference centre for bacterial insertion sequences"
    year: 2006
    doi: 10.1093/nar/gkj014
    pmid: "16381877"
    url: https://academic.oup.com/nar/article/34/suppl_1/D32/1132247
    supports:
      - Insertion sequences carry standardized family nomenclature in a dedicated reference center.
    limitations:
      - An IS-like annotation is not a family assignment without sequence comparison.
  - id: schwengers-2021-bakta
    type: primary_article
    title: "Bakta: rapid and standardized annotation of bacterial genomes via alignment-free sequence identification"
    year: 2021
    doi: 10.1099/mgen.0.000685
    pmid: "34739369"
    pmcid: PMC8743544
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8743544/
    supports:
      - Bakta is a versioned command-line annotation pipeline whose database releases are declared alongside its outputs.
    limitations:
      - Tool output forms change across versions; observed input annotations remain authoritative over general tool claims.
  - id: garcillan-barcia-2025-extended-mobility
    type: primary_article
    title: "The extended mobility of plasmids"
    year: 2025
    doi: 10.1093/nar/gkaf652
    pmid: "40694848"
    pmcid: PMC12282955
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12282955/
    supports:
      - Plasmid mobility extends beyond canonical conjugation, and mobility frameworks cover mobilization routes broader than a single transfer pathway.
    limitations:
      - The review's extended-mobility framing does not transfer mechanism or route conclusions to annotation co-occurrence in a new genome.
  - id: johnson-2015-ice
    type: primary_article
    title: "Integrative and Conjugative Elements (ICEs): What They Do and How They Work"
    year: 2015
    doi: 10.1146/annurev-genet-112414-055018
    pmid: "26473380"
    pmcid: PMC5180612
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5180612/
    supports:
      - Integrative and conjugative elements are modular mobile elements that combine chromosomal integration and conjugative transfer functions in one element.
    limitations:
      - Integration and conjugation annotations in one record do not establish an ICE boundary or an active element.
  - id: mazel-2006-integrons
    type: primary_article
    title: "Integrons: agents of bacterial evolution"
    year: 2006
    doi: 10.1038/nrmicro1462
    pmid: "16845431"
    url: https://doi.org/10.1038/nrmicro1462
    supports:
      - Integrons are recombination platforms that capture exogenous gene cassettes through an integron integrase and convert them into functional genes.
    limitations:
      - An integron-like annotation is not a cassette-array inventory or a resistance-gene prediction without sequence analysis.
  - id: qiu-2022-ta-classification
    type: primary_article
    title: "Toxin-antitoxin systems: Classification, biological roles, and applications"
    year: 2022
    doi: 10.1016/j.micres.2022.127159
    pmid: "35969944"
    url: https://doi.org/10.1016/j.micres.2022.127159
    supports:
      - Toxin-antitoxin systems are classified into types according to the nature and mechanism of the antitoxin.
    limitations:
      - A review classification does not transfer to an annotation match in a new genome, and this catalog assigns no type number to annotations.
  - id: yao-2026-mnt-hepn
    type: primary_article
    title: "Dual regulation of HEPN RNase in fused MNT-HEPN toxin-antitoxin systems via protein OligoAMPylation and oligomerization"
    year: 2026
    doi: 10.1093/nar/gkag228
    pmid: "41854079"
    pmcid: PMC13000451
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13000451/
    supports:
      - Fused MNT-HEPN proteins are documented members of the HEPN/MNT toxin-antitoxin family with AMPylation-based regulation in studied systems.
    limitations:
      - Regulation biochemistry in studied systems is not generalized to annotation matches in new genomes.
  - id: liu-2022-vfdb
    type: primary_article
    title: "VFDB 2022: a general classification scheme for bacterial virulence factors"
    year: 2022
    doi: 10.1093/nar/gkab1107
    pmid: "34850947"
    pmcid: PMC8728188
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8728188/
    supports:
      - Virulence-factor determination relies on a curated, versioned database with an explicit classification scheme.
    limitations:
      - Database releases supersede earlier descriptions; version provenance is required for any future comparison.
  - id: partridge-2018-mge-amr
    type: primary_article
    title: "Mobile Genetic Elements Associated with Antimicrobial Resistance"
    year: 2018
    doi: 10.1128/CMR.00088-17
    pmid: "30068738"
    pmcid: PMC6148190
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6148190/
    supports:
      - Resistance genes are associated with diverse mobile genetic elements, including plasmids, transposons, integrons, and gene cassettes.
    limitations:
      - Association documented in the review does not establish that a generic resistance-like annotation in a record is mobile.
  - id: arndt-2016-phaster
    type: primary_article
    title: "PHASTER: a better, faster version of the PHAST phage search tool"
    year: 2016
    doi: 10.1093/nar/gkw387
    pmid: "27141966"
    pmcid: PMC4987931
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4987931/
    supports:
      - Dedicated prophage identification and annotation is performed from sequence by an external tool, not from product annotations.
    limitations:
      - Prophage boundary predictions carry method-specific uncertainty and require external provenance.
  - id: camargo-2024-genomad
    type: primary_article
    title: "Identification of mobile genetic elements with geNomad"
    year: 2024
    doi: 10.1038/s41587-023-01953-y
    pmid: "37735266"
    pmcid: PMC11324519
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11324519/
    supports:
      - Virus and plasmid identification from sequence data is performed by external tools combining marker genes and machine-learning classifiers.
    limitations:
      - External classifications depend on model versions, marker sets, and thresholds, which must be reported with any imported result.
  - id: xie-2017-isescan
    type: primary_article
    title: "ISEScan: automated identification of insertion sequence elements in prokaryotic genomes"
    year: 2017
    doi: 10.1093/bioinformatics/btx433
    pmid: "29077810"
    url: https://doi.org/10.1093/bioinformatics/btx433
    supports:
      - Insertion-sequence elements can be identified automatically from genome sequence by an external tool.
    limitations:
      - Sequence-level IS family calls cannot be reproduced from product annotations alone.
  - id: johansson-2021-mobileelementfinder
    type: primary_article
    title: "Detection of mobile genetic elements associated with antibiotic resistance in Salmonella enterica using a newly developed web tool: MobileElementFinder"
    year: 2021
    doi: 10.1093/jac/dkaa390
    pmid: "33009809"
    pmcid: PMC7729385
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7729385/
    supports:
      - Mobile-element detection from sequence is performed by external tools backed by curated element databases.
    limitations:
      - The tool's database composition and thresholds bound any future imported result.
  - id: bakta-origin-docs
    type: official_documentation
    title: Bakta documentation
    url: https://bakta.readthedocs.io/en/latest/
    accessed: "2026-08-22"
    supports:
      - Bakta capabilities and output representation are version-sensitive.
    limitations:
      - Observed typed input features take precedence over general tool claims.
  - id: insdc-feature-table
    type: official_documentation
    title: INSDC feature table definitions
    url: https://www.ncbi.nlm.nih.gov/genbank/feature_table/
    accessed: "2026-08-22"
    supports:
      - Controlled source qualifiers and feature keys are submitted annotation evidence.
    limitations:
      - A qualifier is not independent biological validation.
  - id: local-record-classification-policy
    type: local_rule
    rule_ids:
      - source_plasmid_qualifier
      - source_chromosome_qualifier
      - bounded_description_plasmid_token
      - bounded_description_chromosome_token
      - bounded_name_plasmid_token
      - bounded_name_chromosome_token
    rationale: Preserve controlled declarations and label bounded free-text clues as tentative.
    adjudicator: genbank-parser maintainers
    date: "2026-08-22"
    negative_controls:
      - plasmid-like protein
      - chromosome partition protein
    limitations:
      - Name and description tokens are annotation clues, not replicon prediction.
  - id: local-annotation-candidate-policy
    type: local_rule
    rule_ids:
      - replication_annotation_candidate
      - mobilizable_core_annotation_candidate
      - helper_machinery_annotation_candidate
    rationale: Preserve bounded annotation observations while avoiding phenotype and identity claims.
    adjudicator: genbank-parser maintainers
    date: "2026-08-22"
    negative_controls:
      - generic product labels
      - pseudogenized candidates
    limitations:
      - Annotation candidates do not demonstrate function or transfer.
  - id: local-disabled-aggregate-policy
    type: local_rule
    rule_ids:
      - pxo_like_annotation_pattern_candidate
      - phage_module_bearing_plasmid_candidate
    rationale: Retain component observations while disabling unvalidated aggregate classifiers.
    adjudicator: genbank-parser maintainers
    date: "2026-08-22"
    negative_controls:
      - repeated product labels on one feature
      - unrelated records with isolated phage annotations
    limitations:
      - Enablement requires separately reviewed positive and negative controls.
