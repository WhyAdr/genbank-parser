schema_version: 1
catalog_version: "1.5.0"

facets:
  - id: replication_origin
    title: Annotated replication-origin evidence
  - id: replication_initiation
    title: Replication-initiation protein evidence
  - id: mobility_orit
    title: Origin-of-transfer evidence
  - id: mobility_relaxase
    title: Relaxase evidence
  - id: mobility_t4cp
    title: Type IV coupling-protein evidence
  - id: mobility_mpf
    title: Mating-pair-formation evidence
  - id: ta_toxin
    title: Toxin-antitoxin toxin evidence
  - id: ta_antitoxin
    title: Toxin-antitoxin antitoxin evidence
  - id: ta_accessory
    title: Toxin-antitoxin accessory component annotation evidence
  - id: partition_maintenance
    title: Partition or plasmid-maintenance annotation evidence
  - id: recombination
    title: Recombination or integration annotation evidence
  - id: transposition
    title: Transposition annotation evidence
  - id: phage_integration
    title: Phage integration or excision annotation evidence
  - id: phage_packaging
    title: Phage packaging annotation evidence
  - id: phage_structure
    title: Phage structural annotation evidence
  - id: phage_lysis
    title: Phage lysis annotation evidence
  - id: phage_replication
    title: Phage replication annotation evidence
  - id: phage_regulation
    title: Phage regulation or communication annotation evidence
  - id: crispr_array
    title: CRISPR repeat-array annotation evidence
  - id: crispr_cas
    title: Cas annotation evidence
  - id: amr_candidate
    title: Antimicrobial-resistance annotation candidate
  - id: vf_candidate
    title: Virulence-associated annotation candidate
  - id: pxo_numbered_annotation
    title: pXO-numbered product annotation observation

markers:
  - id: explicit_origin_of_transfer
    label: Explicitly annotated origin of transfer
    facets: [mobility_orit]
    feature_types: [oriT, regulatory]
    matchers:
      - field: feature_type
        mode: casefold_exact
        patterns: [oriT]
        negative_patterns: []
        strength: 3
      - field: regulatory_class
        mode: casefold_exact
        patterns: [oriT]
        negative_patterns: []
        strength: 3
    requires_non_pseudo: false
    requires_complete: false
    sources: [bakta-origin-docs, insdc-feature-table, schwengers-2021-bakta]
    interpretation: Supports the presence of an explicitly annotated oriT feature.
    limitations:
      - Annotation does not prove a cognate relaxase relationship.
      - Annotation does not demonstrate transfer.

  - id: generic_replication_origin
    label: Generic annotated replication origin
    facets: [replication_origin]
    feature_types: [rep_origin]
    matchers:
      - field: feature_type
        mode: casefold_exact
        patterns: [rep_origin]
        negative_patterns: []
        strength: 3
    requires_non_pseudo: false
    requires_complete: false
    sources: [insdc-feature-table]
    interpretation: Supports a generic annotated replication-origin feature.
    limitations:
      - Does not distinguish oriC from oriV unless an explicit qualifier does so.

  - id: explicit_origin_of_replication
    label: Explicitly annotated plasmid replication origin
    facets: [replication_origin]
    feature_types: [oriV, regulatory, rep_origin]
    matchers:
      - field: feature_type
        mode: casefold_exact
        patterns: [oriV]
        negative_patterns: []
        strength: 3
      - field: regulatory_class
        mode: casefold_exact
        patterns: [oriV, plasmid_replication_origin]
        negative_patterns: []
        strength: 3
    requires_non_pseudo: false
    requires_complete: false
    sources: [bakta-origin-docs, insdc-feature-table, schwengers-2021-bakta]
    interpretation: Supports an explicitly annotated plasmid replication-origin feature.
    limitations:
      - Annotation alone does not establish replication mechanism or autonomy.

  - id: replication_initiation_candidate
    label: Replication-initiation annotation candidate
    facets: [replication_initiation]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [repA, repB, repL, repS, repF, repFR, repX]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:replication initiator|replication initiation|replication protein|replicase|replication-relaxation)\\b"
        negative_patterns:
          - "(?i)\\btranscriptional repressor\\b"
        strength: 1
    requires_non_pseudo: true
    requires_complete: true
    sources: [anand-2008-repx, catchpole-1991-pt48-mutants, catchpole-1992-pt48, khan-1982-psn2, kwong-2017-staph-plasmids, local-annotation-candidate-policy, projan-1987-pim13, sprincova-2005-psrd191, tinsley-2006-repx]
    interpretation: Retains a replication-initiation annotation candidate.
    limitations:
      - Does not identify a replication mechanism or incompatibility group.
      - The repX-specific citations anchor the repX pattern only.
      - repL annotations are anchored by the pT48 and pSN2-family RepL literature and remain replication-mechanism-neutral.

  - id: relaxase_candidate
    label: Relaxase annotation candidate
    facets: [mobility_relaxase]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [mobA, mobC, mobF, traI, virD2]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:relaxase|mobility protein)\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [garcillan-barcia-2009-relaxases, garcillan-barcia-2025-extended-mobility, smillie-2010-mobility]
    interpretation: Retains a relaxase annotation candidate.
    limitations:
      - Annotation does not demonstrate nicking or transfer.

  - id: t4cp_candidate
    label: Type IV coupling-protein annotation candidate
    facets: [mobility_t4cp]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [traD, traG, virD4, tcpA]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:type IV coupling protein|coupling protein Tra[DG]|VirD4)\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [christie-2025-t4ss, garcillan-barcia-2025-extended-mobility, smillie-2010-mobility]
    interpretation: Retains a Type IV coupling-protein annotation candidate.
    limitations:
      - Annotation does not establish a complete transfer apparatus.

  - id: mpf_component
    label: Mating-pair-formation annotation component
    facets: [mobility_mpf]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: regex
        patterns:
          - "(?i)^tra(?:A|B|C|E|F|K|L|N|U|W)$"
          - "(?i)^virB(?:[1-9]|1[01])$"
          - "(?i)^trb[B-L]$"
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:mating pair formation|conjugal transfer protein|type IV secretion system protein)\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [christie-2025-t4ss, garcillan-barcia-2025-extended-mobility, smillie-2010-mobility]
    interpretation: Retains a mating-pair-formation annotation component.
    limitations:
      - Multiple annotated components do not establish expression or transfer.

  - id: toxn
    label: ToxN-family toxin annotation
    facets: [ta_toxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [toxN]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bToxN(?:-family)?\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [blower-2012-toxin, qiu-2022-ta-classification]
    interpretation: Supports a ToxN-family toxin annotation.
    limitations:
      - Annotation does not establish toxin activity.

  - id: toxi
    label: ToxI RNA antitoxin annotation
    facets: [ta_antitoxin]
    feature_types: [ncRNA, misc_RNA, repeat_region, regulatory, CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [toxI]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bToxI(?: RNA)?(?: antitoxin)?\\b"
        negative_patterns: []
        strength: 2
      - field: note
        mode: regex
        patterns:
          - "(?i)\\bToxI\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: true
    requires_complete: true
    sources: [blower-2012-toxin, qiu-2022-ta-classification]
    interpretation: Supports a ToxI RNA antitoxin annotation.
    limitations:
      - ToxI correspondence does not establish Type III system activity.

  - id: hept
    label: HepT-family toxin annotation
    facets: [ta_toxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [hepT]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bHepT(?:-family)?\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [qiu-2022-ta-classification, yao-2020-hepn-mnt]
    interpretation: Supports a HepT-family toxin annotation.
    limitations:
      - Annotation does not establish toxin activity.

  - id: mnta
    label: MntA-family antitoxin annotation
    facets: [ta_antitoxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [mntA]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bMntA(?:-family)?\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [qiu-2022-ta-classification, yao-2020-hepn-mnt]
    interpretation: Supports an MntA-family antitoxin annotation.
    limitations:
      - The cited chemistry is not generalized to every annotation match.

  - id: tenpn
    label: TenpN-family toxin annotation
    facets: [ta_toxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [tenpN]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bTenpN(?:-family)?\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [blower-2012-toxin, qiu-2022-ta-classification]
    interpretation: Supports a TenpN-family Type III toxin annotation.
    limitations:
      - Annotation does not establish toxin activity.

  - id: tenpi
    label: TenpI RNA antitoxin annotation
    facets: [ta_antitoxin]
    feature_types: [ncRNA, misc_RNA, repeat_region, regulatory, CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [tenpI]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bTenpI(?: RNA)?(?: antitoxin)?\\b"
        negative_patterns: []
        strength: 2
      - field: note
        mode: regex
        patterns:
          - "(?i)\\bTenpI\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: true
    requires_complete: true
    sources: [blower-2012-toxin, qiu-2022-ta-classification]
    interpretation: Supports a TenpI RNA antitoxin annotation.
    limitations:
      - TenpI correspondence does not establish Type III system activity.

  - id: cptn
    label: CptN-family toxin annotation
    facets: [ta_toxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [cptN]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bCptN(?:-family)?\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [blower-2012-toxin, qiu-2022-ta-classification]
    interpretation: Supports a CptN-family Type III toxin annotation.
    limitations:
      - Annotation does not establish toxin activity.

  - id: cpti
    label: CptI RNA antitoxin annotation
    facets: [ta_antitoxin]
    feature_types: [ncRNA, misc_RNA, repeat_region, regulatory, CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [cptI]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bCptI(?: RNA)?(?: antitoxin)?\\b"
        negative_patterns: []
        strength: 2
      - field: note
        mode: regex
        patterns:
          - "(?i)\\bCptI\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: true
    requires_complete: true
    sources: [blower-2012-toxin, qiu-2022-ta-classification]
    interpretation: Supports a CptI RNA antitoxin annotation.
    limitations:
      - CptI correspondence does not establish Type III system activity.

  - id: zeta
    label: Zeta-family toxin annotation
    facets: [ta_toxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [zeta]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bzeta toxin\\b"
        negative_patterns:
          - "(?i)carotene"
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [camacho-2002-oez, chan-2023-type2-ta]
    interpretation: Supports a zeta-family toxin annotation.
    limitations:
      - Annotation does not establish toxin activity or phosphoryl transfer.

  - id: epsilon
    label: Epsilon-family antitoxin annotation
    facets: [ta_antitoxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [epsilon]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bepsilon (?:antitoxin|antidote)\\b"
        negative_patterns:
          - "(?i)polymerase"
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [brzozowska-2014-epsilon-clpx, camacho-2002-oez]
    interpretation: Supports an epsilon-family antitoxin annotation.
    limitations:
      - The cited neutralization chemistry is not generalized to every annotation match.

  - id: omega
    label: Omega-family accessory regulator annotation
    facets: [ta_accessory]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [omega]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bomega (?:transcriptional )?repressor\\b"
        negative_patterns:
          - "(?i)fatty acid"
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [chan-2023-type2-ta, dmowski-2016-omega-parb]
    interpretation: Supports an omega-family accessory regulator annotation.
    limitations:
      - An omega annotation does not establish partition or copy-number control.

  - id: mqsr
    label: MqsR-family toxin annotation
    facets: [ta_toxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [mqsR]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bMqsR\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [chan-2023-type2-ta, fernandez-garcia-2024-mqsrac, qiu-2022-ta-classification]
    interpretation: Supports an MqsR-family toxin annotation.
    limitations:
      - Annotation does not establish toxin activity.

  - id: mqsa
    label: MqsA-family antitoxin annotation
    facets: [ta_antitoxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [mqsA]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bMqsA\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [chan-2023-type2-ta, fernandez-garcia-2024-mqsrac, qiu-2022-ta-classification]
    interpretation: Supports an MqsA-family antitoxin annotation.
    limitations:
      - Annotation does not establish antitoxin activity.

  - id: mqsc
    label: MqsC-family accessory chaperone annotation
    facets: [ta_accessory]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [mqsC]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bMqsC\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [fernandez-garcia-2024-mqsrac]
    interpretation: Supports an MqsC-family accessory chaperone annotation.
    limitations:
      - The SecB-type chaperone correspondence is documented for the studied MqsRAC system and is not generalized to every mqsC annotation.

  - id: higb
    label: HigB-family toxin annotation
    facets: [ta_toxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [higB, higB1, higB2]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bHigB(?:1|2)?(?:-family)? toxin\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [bordes-2011-tac, mets-2024-tac-phage-sensing, qiu-2022-ta-classification]
    interpretation: Supports a HigB-family toxin annotation.
    limitations:
      - Annotation does not establish toxin activity.

  - id: higa
    label: HigA-family antitoxin annotation
    facets: [ta_antitoxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [higA, higA1, higA2]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bHigA(?:1|2)?(?:-family)? antitoxin\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [bordes-2011-tac, mets-2024-tac-phage-sensing, qiu-2022-ta-classification]
    interpretation: Supports a HigA-family antitoxin annotation.
    limitations:
      - Annotation does not establish antitoxin activity.

  - id: tac_chaperone
    label: Toxin-antitoxin-chaperone SecB-like chaperone annotation
    facets: [ta_accessory]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [higC, rv1957]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:SecB-?like|antitoxin|TAC) chaperone\\b"
        negative_patterns:
          - "(?i)chaperonin"
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [bordes-2011-tac, mansour-2022-tac, mets-2024-tac-phage-sensing, nakamoto-2026-tac-diversity]
    interpretation: Supports a toxin-antitoxin-chaperone (TAC) SecB-like chaperone annotation.
    limitations:
      - A SecB-like chaperone annotation does not establish antitoxin stabilization.

  - id: retron_rt
    label: Retron-encoded reverse-transcriptase annotation
    facets: [ta_antitoxin]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bretron .{0,30}reverse transcriptase\\b"
        negative_patterns:
          - "(?i)group (?:II|2) intron"
          - "(?i)retrotransposon"
          - "(?i)telomerase"
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [bobonis-2022-retron]
    interpretation: Supports a retron-encoded reverse-transcriptase annotation.
    limitations:
      - A reverse-transcriptase annotation does not establish msDNA biosynthesis or antiphage defense.

  - id: msdna
    label: msDNA region annotation
    facets: [ta_antitoxin]
    feature_types: [ncRNA, misc_RNA, misc_feature, repeat_region, CDS, pseudogene]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [msr, msd]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\bmsDNA\\b"
          - "(?i)\\bmulticopy single[- ]stranded DNA\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [bobonis-2022-retron]
    interpretation: Supports an msDNA (msr/msd) region annotation.
    limitations:
      - msDNA correspondence does not establish retron antiphage activity.
  - id: partition_maintenance_candidate
    label: Partition or maintenance annotation candidate
    facets: [partition_maintenance]
    feature_types: [CDS, pseudogene, mobile_element]
    matchers:
      - field: gene
        mode: casefold_exact
        patterns: [parA, parB, tubZ, tubR, copG, copA, copB]
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:partition(?:ing)? protein|plasmid maintenance|copy number control|CopG family)\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: false
    requires_complete: false
    sources: [bouet-2019-partition, local-annotation-candidate-policy]
    interpretation: Retains partition or plasmid-maintenance annotation evidence.
    limitations:
      - Observation does not establish stable inheritance.

  - id: recombination_candidate
    label: Recombination or integration annotation candidate
    facets: [recombination]
    feature_types: [CDS, pseudogene, mobile_element, misc_feature]
    matchers:
      - field: mobile_element_type
        mode: regex
        patterns:
          - "(?i)\\b(?:integron|integrative|recombinase)\\b"
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:integrase|recombinase|resolvase|invertase)\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: false
    requires_complete: false
    sources: [johnson-2015-ice, local-annotation-candidate-policy, mazel-2006-integrons, siguier-2006-isfinder]
    interpretation: Retains recombination or integration annotation evidence.
    limitations:
      - Observation does not establish an element boundary or activity.

  - id: phage_integration_candidate
    label: Phage integration or excision annotation candidate
    facets: [recombination, phage_integration]
    feature_types: [CDS, pseudogene, mobile_element, misc_feature]
    matchers:
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:phage|prophage).{0,40}\\b(?:integrase|excisionase)\\b"
          - "(?i)\\b(?:integrase|excisionase).{0,40}\\b(?:phage|prophage)\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: false
    requires_complete: false
    sources: [local-annotation-candidate-policy]
    interpretation: Retains a phage integration or excision annotation candidate.
    limitations:
      - Does not establish prophage boundaries or phagemid identity.

  - id: transposition_candidate
    label: Transposition annotation candidate
    facets: [transposition]
    feature_types: [CDS, pseudogene, mobile_element, misc_feature]
    matchers:
      - field: mobile_element_type
        mode: regex
        patterns:
          - "(?i)\\b(?:insertion sequence|transposon|IS\\d+)\\b"
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:transposase|insertion sequence)\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: false
    requires_complete: false
    sources: [local-annotation-candidate-policy]
    interpretation: Retains transposition annotation evidence.
