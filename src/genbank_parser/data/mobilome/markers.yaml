  - id: crispr_repeat_array
    label: CRISPR repeat-array annotation
    facets: [crispr_array]
    feature_types: [repeat_region, misc_feature, regulatory]
    matchers:
      - field: rpt_type
        mode: casefold_exact
        patterns: [CRISPR]
        negative_patterns: []
        strength: 3
      - field: note
        mode: regex
        patterns:
          - "(?i)\\bCRISPR(?: repeat(?: region| array)?)?\\b"
        negative_patterns: []
        strength: 1
    requires_non_pseudo: false
    requires_complete: false
    sources: [bakta-origin-docs, insdc-feature-table, schwengers-2021-bakta]
    interpretation: Supports an explicitly annotated CRISPR repeat-array feature.
    limitations:
      - Annotation does not establish active immunity or target specificity.

  - id: crispr_cas_candidate
    label: Cas annotation candidate
    facets: [crispr_cas]
    feature_types: [CDS, pseudogene]
    matchers:
      - field: gene
        mode: regex
        patterns:
          - "(?i)^cas(?:(?:[1-9]|1[0-4])[a-z]?|[A-F])$"
        negative_patterns: []
        strength: 2
      - field: product
        mode: regex
        patterns:
          - "(?i)\\b(?:CRISPR-associated|Cas(?:(?:[1-9]|1[0-4])[a-z]?|[A-F]))\\b"
        negative_patterns: []
        strength: 2
    requires_non_pseudo: true
    requires_complete: true
    sources: [bakta-origin-docs, makarova-2020-crispr, makarova-2025-crispr-classification]
    interpretation: Retains a Cas annotation candidate.
    limitations:
      - Annotation does not establish a complete or active CRISPR system.

